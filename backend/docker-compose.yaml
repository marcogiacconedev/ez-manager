version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ezmanager-backend
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    depends_on:
      - postgres
    networks:
      - ezmanager-net

  postgres:
    image: postgres:16
    container_name: ezmanager-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env.dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ezmanager-net

volumes:
  postgres-data:

networks:
  ezmanager-net:
    driver: bridge
